services:
  postgres_dev:
    image: postgres:16-alpine
    container_name: catalog_postgres_dev
    environment:
      POSTGRES_USER: c_log
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: catalog_db_dev
    ports:
      - '5432:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data

  redis_dev:
    image: redis:7-alpine
    container_name: catalog_redis_dev
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

  catalog-meili:
    image: getmeili/meilisearch:v1.6
    container_name: catalog-meili_dev
    ports:
      - '7700:7700'
    environment:
      - MEILI_MASTER_KEY=supersecretpassword
    restart: unless-stopped

volumes:
  pg_dev_data:
  redis_dev_data:
